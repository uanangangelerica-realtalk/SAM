services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_records_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_records"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campus_records_data:
