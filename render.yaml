services:
  - type: web
    name: campus-records
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-records-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: false
databases:
  - name: campus-records-db
    plan: basic-256mb
